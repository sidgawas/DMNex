databaseChangeLog:
  - changeSet:
      id: 003-create-dmn-published-versions-table
      author: copilot
      changes:
        - createTable:
            tableName: dmn_published_versions
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: dmn_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: xml
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: deleted_by
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: dmn_published_versions
            baseColumnNames: dmn_id
            constraintName: fk_dmn_published_versions_dmn
            referencedTableName: dmns
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT
        - createIndex:
            indexName: idx_dmn_published_versions_dmn_is_deleted
            tableName: dmn_published_versions
            columns:
              - column:
                  name: dmn_id
              - column:
                  name: is_deleted
        - createIndex:
            indexName: idx_dmn_published_versions_updated_at
            tableName: dmn_published_versions
            columns:
              - column:
                  name: updated_at
        - addUniqueConstraint:
            tableName: dmn_published_versions
            columnNames: dmn_id, version, is_deleted
            constraintName: uk_dmn_published_versions_dmn_version_is_deleted

